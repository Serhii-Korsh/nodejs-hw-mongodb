tags:
  - Contacts
summary: Delete a contact
operationId: deleteContact
description: Removes a contact by its `contactId` if it belongs to an authenticated user.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: Unique contact ID
    example: '65f1a0e59b8cde1234567890'
responses:
  '204':
    description: Contact deleted successfully (no content in response)
  '404':
    $ref: '../../../components/responses/404.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
