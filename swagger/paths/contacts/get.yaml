tags:
  - Contacts
summary: Get list of contacts
operationId: getContacts
description: 'Returns a list of contacts belonging to the authenticated user. Supports pagination, sorting and filtering.'
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: Page number for pagination (default 1)
    schema:
      type: integer
    example: 1
  - in: query
    name: perPage
    description: Number of contacts per page (default 10)
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    description: Field by which sorting will be performed (default `_id`)
    schema:
      type: string
      example: 'age'
  - in: query
    name: sortOrder
    description: Sort order (asc or desc)
    schema:
      type: string
      enum: ['asc', 'desc']
      example: 'asc'
  - in: query
    name: contactType
    description: Filter by contact type (work, home, personal)
    schema:
      type: string
      enum: [work, home, personal]
      example: 'work'
responses:
  '200':
    description: Successfully retrieved contact list
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 4
                totalItems:
                  type: number
                  example: 4
                totalPages:
                  type: number
                  example: 4
                hasNextPage:
                  type: boolean
                  example: false
                hasPreviousPage:
                  type: boolean
                  example: true
  '401':
    $ref: '../../components/responses/401.yaml'
